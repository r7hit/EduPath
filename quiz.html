<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPath - IT Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>EduPath</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="assessment.html">Assessment</a>
            <a href="roadmap.html">Roadmap</a>
            <a href="materials.html">Materials</a>
        </nav>
    </header>


    <section class="quiz">

        <h1>📝 IT Knowledge Quiz</h1>

        <p>Test your basic IT knowledge.</p>


        <form id="quizForm">

            <div class="quiz-question">
                <h3>1. What does HTML stand for?</h3>

                <label>
                    <input type="radio" name="q1" value="1" required>
                    Hyper Text Markup Language
                </label>

                <label>
                    <input type="radio" name="q1" value="0">
                    High Text Machine Language
                </label>

                <label>
                    <input type="radio" name="q1" value="0">
                    Hyperlink Text Management Language
                </label>
            </div>


            <div class="quiz-question">
                <h3>2. Which language is used to style a website?</h3>

                <label>
                    <input type="radio" name="q2" value="1" required>
                    CSS
                </label>

                <label>
                    <input type="radio" name="q2" value="0">
                    SQL
                </label>

                <label>
                    <input type="radio" name="q2" value="0">
                    Java
                </label>
            </div>


            <div class="quiz-question">
                <h3>3. Which language makes websites interactive?</h3>

                <label>
                    <input type="radio" name="q3" value="1" required>
                    JavaScript
                </label>

                <label>
                    <input type="radio" name="q3" value="0">
                    HTML
                </label>

                <label>
                    <input type="radio" name="q3" value="0">
                    SQL
                </label>
            </div>


            <div class="quiz-question">
                <h3>4. Which language is commonly used for database queries?</h3>

                <label>
                    <input type="radio" name="q4" value="1" required>
                    SQL
                </label>

                <label>
                    <input type="radio" name="q4" value="0">
                    CSS
                </label>

                <label>
                    <input type="radio" name="q4" value="0">
                    HTML
                </label>
            </div>


            <button type="submit">Check Quiz Score</button>

        </form>


        <div id="quizResult"></div>

    </section>


    <script src="script.js"></script>

</body>
</html>
